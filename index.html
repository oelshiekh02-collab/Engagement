<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Engagment Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg1: #fffaf5;
        --bg2: #f8e7ea;
        --rose: #d77d7d;
        --rose-deep: #ad5c5c;
        --gold: #d9b56d;
        --ivory: #fffdf9;
        --text: #4c3c38;
        --shadow: rgba(110, 70, 66, 0.12);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      
      html, body {
        width: 100vw;
        height: 100vh;
        font-family: "Georgia", "Times New Roman", serif;
        color: var(--text);
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        overflow: hidden;
      }
      
      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bg-blur {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 15% 20%, rgba(215,125,125,0.14), transparent 25%),
          radial-gradient(circle at 80% 30%, rgba(217,181,109,0.14), transparent 20%),
          radial-gradient(circle at 50% 100%, rgba(173,92,92,0.08), transparent 30%);
        filter: blur(12px);
        z-index: 0;
      }

      .hearts {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .heart {
        position: absolute;
        bottom: -10%;
        width: 20px;
        height: 20px;
        transform: rotate(-45deg);
        opacity: 0.8;
        animation: floatUp linear infinite;
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: rgba(215, 125, 125, 0.86);
        border-radius: 50%;
      }

      .heart::before { top: -10px; left: 0; }
      .heart::after { left: 10px; top: 0; }

      @keyframes floatUp {
        0% {
          transform: translate3d(0, 0, 0) rotate(-45deg) scale(0.8);
          opacity: 0;
        }
        10% { opacity: 1; }
        100% {
          transform: translate3d(var(--drift), -110vh, 0) rotate(-45deg) scale(1.2);
          opacity: 0;
        }
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 40px;
        opacity: 1;
        transition: opacity 0.6s ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }

      .splash-decoration {
        font-size: 4rem;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }

      .splash-title {
        font-size: 2.5rem;
        color: var(--rose-deep);
        font-family: 'Amiri', serif;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .splash-message {
        font-size: 1.5rem;
        color: var(--rose-deep);
        font-weight: 600;
        letter-spacing: 0.05em;
        line-height: 1.6;
      }

      .tap-instruction {
        font-size: 1.2rem;
        color: var(--rose);
        animation: pulse 1.5s ease-in-out infinite;
        margin-top: 20px;
        font-weight: 600;
      }

      .tap-dots {
        display: inline-block;
        width: 30px;
        overflow: hidden;
        vertical-align: middle;
        margin-left: 10px;
      }

      .tap-dots span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rose);
        margin: 0 4px;
        animation: bounce 1.4s infinite;
      }

      .tap-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .tap-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(1);
          opacity: 0.7;
        }
        40% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      .container {
        position: fixed;
        inset: 0;
        z-index: 2;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
      }

      .card {
        width: 100vw;
        min-height: 100vh;
        background: rgba(255, 255, 255, 0.52);
        border: none;
        position: relative;
        backdrop-filter: blur(5px);
        display: flex;
        flex-direction: column;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border: 1px solid rgba(215,125,125,0.28);
        border-radius: 50%;
      }

      .card::before {
        top: -90px;
        left: -60px;
      }

      .card::after {
        right: -60px;
        bottom: -90px;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        padding: 60px 20px;
        text-align: center;
        opacity: 0;
        transform: translateY(50px);
        animation: reveal 1.8s ease forwards 0.5s;
        gap: 12px;
        min-height: 100vh;
      }

      @keyframes reveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .image-container {
        width: 280px;
        height: 280px;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid rgba(173, 92, 92, 0.35);
        box-shadow: 0 12px 32px rgba(173, 92, 92, 0.25);
        background: rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin: 20px 0;
      }

      .image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .topline {
        letter-spacing: 0.4rem;
        text-transform: uppercase;
        font-size: 0.9rem;
        color: var(--rose-deep);
        font-weight: 600;
      }

      h1 {
        font-size: 4rem;
        line-height: 1.05;
        margin: 18px 0 8px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #4f3935;
      }

      .and {
        font-size: 2.8rem;
        color: var(--gold);
        margin: 4px 0;
      }

      .sub {
        margin-top: 18px;
        color: rgba(76,60,56,0.8);
        font-size: 1.2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .divider {
        width: 180px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(173,92,92,0.8), transparent);
        margin: 26px auto;
      }

      .details {
        margin-top: 10px;
        display: grid;
        gap: 12px;
        font-size: 1.1rem;
        line-height: 1.7;
        margin-bottom: 40px;
      }

      .details strong {
        font-weight: 700;
      }

      .flowers {
        position: absolute;
        inset: auto 0 0 0;
        height: 130px;
        pointer-events: none;
      }

      .flowers::before,
      .flowers::after {
        content: "";
        position: absolute;
        bottom: 0;
        width: 42%;
        height: 120px;
        background: radial-gradient(circle at 50% 0%, rgba(215,125,125,0.12), transparent 60%);
      }

      .flowers::before {
        left: -10%;
      }

      .flowers::after {
        right: -10%;
      }

      .petal {
        position: absolute;
        bottom: 12px;
        width: 18px;
        height: 28px;
        background: linear-gradient(180deg, #f7d5d5, #d99c9c);
        border-radius: 60% 10% 60% 10%;
        opacity: 0.8;
        transform-origin: center bottom;
        animation: sway 5s ease-in-out infinite;
      }

      .petal:nth-child(odd) {
        background: linear-gradient(180deg, #f6d7a2, #d4ac63);
      }

      .petal:nth-child(1) { left: 12%; animation-delay: 0s; }
      .petal:nth-child(2) { left: 22%; animation-delay: 0.6s; }
      .petal:nth-child(3) { left: 36%; animation-delay: 1.4s; }
      .petal:nth-child(4) { left: 49%; animation-delay: 0.8s; }
      .petal:nth-child(5) { left: 62%; animation-delay: 1.6s; }
      .petal:nth-child(6) { left: 76%; animation-delay: 0.2s; }
      .petal:nth-child(7) { left: 88%; animation-delay: 1.2s; }

      @keyframes sway {
        0%, 100% { transform: rotate(-12deg) translateY(0); }
        50% { transform: rotate(12deg) translateY(-8px); }
      }

      .countdown {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      .time-box {
        min-width: 80px;
        padding: 12px 10px;
        border-radius: 14px;
        background: rgba(255,255,255,0.55);
        border: 1px solid rgba(173,92,92,0.18);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      }

      .time-box .num {
        display: block;
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--rose-deep);
      }

      .time-box .label {
        display: block;
        font-size: 0.75rem;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        color: rgba(76, 60, 56, 0.72);
        margin-top: 2px;
      }

      .title-quote {
        margin-top: 12px;
        margin-bottom: 8px;
        font-size: 2rem;
        letter-spacing: 0.06em;
        color: var(--rose-deep);
        font-family: 'Amiri', serif;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(173, 92, 92, 0.15);
        line-height: 1.8;
      }

      @media (max-width: 768px) {
        .splash-title {
          font-size: 2rem;
        }

        .splash-message {
          font-size: 1.1rem;
        }

        .image-container {
          width: 220px;
          height: 220px;
        }

        h1 {
          font-size: 2.5rem;
        }

        .and {
          font-size: 2rem;
        }

        .title-quote {
          font-size: 1.5rem;
        }

        .details {
          font-size: 1rem;
        }
      }

      @media (max-width: 480px) {
        .splash-title {
          font-size: 1.8rem;
        }

        .splash-message {
          font-size: 1rem;
        }

        .splash-decoration {
          font-size: 3rem;
        }

        .content {
          padding: 40px 15px;
          gap: 8px;
        }

        .image-container {
          width: 160px;
          height: 160px;
          margin: 15px 0;
        }

        h1 {
          font-size: 1.8rem;
        }

        .and {
          font-size: 1.3rem;
        }

        .title-quote {
          font-size: 1.1rem;
        }

        .topline {
          font-size: 0.7rem;
        }

        .sub {
          font-size: 0.95rem;
        }

        .details {
          font-size: 0.9rem;
          gap: 8px;
          margin-bottom: 30px;
        }

        .countdown {
          gap: 8px;
        }

        .time-box {
          min-width: 60px;
          padding: 8px 6px;
        }

        .time-box .num {
          font-size: 1.2rem;
        }

        .time-box .label {
          font-size: 0.6rem;
        }
      }

      @media (max-height: 600px) {
        .content {
          padding: 30px 15px;
          gap: 6px;
        }

        .image-container {
          width: 150px;
          height: 150px;
          margin: 10px 0;
        }

        h1 {
          font-size: 1.8rem;
          margin: 8px 0 4px;
        }

        .and {
          font-size: 1.3rem;
        }

        .title-quote {
          font-size: 1rem;
          margin: 4px 0;
        }

        .sub {
          margin-top: 8px;
          font-size: 0.9rem;
        }

        .divider {
          margin: 12px auto;
        }

        .details {
          font-size: 0.85rem;
          gap: 6px;
          margin-bottom: 20px;
        }

        .countdown {
          margin-top: 8px;
          gap: 6px;
        }

        .time-box {
          min-width: 55px;
          padding: 6px 5px;
        }

        .time-box .num {
          font-size: 1rem;
        }

        .flowers {
          height: 60px;
        }
      }
    </style>
  </head>
  <body>
    <audio id="background-audio" autoplay loop playsinline preload="auto" src="https://media.vocaroo.com/mp3/17F5OgNFmBVU"></audio>

    <div class="splash-screen" id="splashScreen">
      <div class="splash-content">
        <div class="splash-decoration">💍</div>
        <div class="splash-title">يسعدنا دعوتك</div>
        <div class="splash-message">
          اضغط على الشاشة<br>ضغطتين لفتح الدعوة
        </div>
        <div class="tap-instruction">
          <div class="tap-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-blur"></div>
    <div class="hearts" id="hearts"></div>

    <div class="container">
      <div class="card">
        <div class="content">
          <div class="topline">With joy in our hearts</div>

          <div class="image-container">
            <img src="https://i.postimg.cc/5NcRT3pZ/IMG-20261004-WA0044.jpg" alt="Wedding couple" />
          </div>

          <div class="title-quote">خالد قد نال دعاء</div>

          <h1>Khaled</h1>
          <div class="and">&amp;</div>
          <h1>Doaa</h1>

          <div class="sub">We invite you to attend our engagement party.</div>

          <div class="divider"></div>

          <div class="details">
            <div><strong>Thursday, 8 October 2026</strong></div>
            <div>At 8:00 PM</div>
            <div>At Bride home</div>
            <div>Our joy wouldn't be complete without you.</div>
          </div>

          <div class="countdown" aria-label="Wedding countdown">
            <div class="time-box"><span class="num" id="days">00</span><span class="label">Days</span></div>
            <div class="time-box"><span class="num" id="hours">00</span><span class="label">Hours</span></div>
            <div class="time-box"><span class="num" id="minutes">00</span><span class="label">Mins</span></div>
            <div class="time-box"><span class="num" id="seconds">00</span><span class="label">Secs</span></div>
          </div>
        </div>

        <div class="flowers" aria-hidden="true">
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
        </div>
      </div>
    </div>

    <script>
      const heartsContainer = document.getElementById("hearts");
      const audio = document.getElementById("background-audio");
      const splashScreen = document.getElementById("splashScreen");
      let tapCount = 0;
      const TAP_THRESHOLD = 500;
      let lastTapTime = 0;

      function hideSplashScreen() {
        splashScreen.classList.add("hidden");
        setTimeout(() => {
          splashScreen.style.display = "none";
        }, 600);
        playAudio();
      }

      function playAudio() {
        if (!audio) return;
        audio.volume = 0.45;
        audio.play().catch(() => {
          console.log("Autoplay blocked, waiting for user interaction");
        });
      }

      function onScreenTap() {
        const now = Date.now();
        if (now - lastTapTime < TAP_THRESHOLD) {
          tapCount++;
        } else {
          tapCount = 1;
        }
        lastTapTime = now;

        if (tapCount >= 2) {
          hideSplashScreen();
          document.removeEventListener("pointerdown", onScreenTap);
        }
      }

      document.addEventListener("pointerdown", onScreenTap);
      window.addEventListener("load", () => {
        playAudio();
      });

      function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "%";
        heart.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
        heart.style.animationDuration = (9 + Math.random() * 8) + "s";
        heart.style.animationDelay = (Math.random() * 5) + "s";
        heart.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
        heartsContainer.appendChild(heart);
        setTimeout(() => heart.remove(), 17000);
      }

      for (let i = 0; i < 18; i++) {
        createHeart();
      }
      setInterval(createHeart, 700);

      const engagementDate = new Date("2026-10-08T20:00:00");
      function updateCountdown() {
        const now = new Date();
        const diff = engagementDate - now;

        if (diff <= 0) {
          document.getElementById("days").textContent = "00";
          document.getElementById("hours").textContent = "00";
          document.getElementById("minutes").textContent = "00";
          document.getElementById("seconds").textContent = "00";
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("days").textContent = String(days).padStart(2, "0");
        document.getElementById("hours").textContent = String(hours).padStart(2, "0");
        document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
        document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
  </html>
